setup:
  dataset:
  - id: actprm_first_error_16to60_v1
    sha256: 2e0b465bf251f54f79a974b09b0488bd6b5f9670e67423d9aa8d42139b58a275
    content:
      name: actprm, failed traces with 16-60 steps, first-error label
      path: data/lrm_traces/normalized/actprm/data.jsonl
      filter:
        has_error: true
        min_steps: 16
        max_steps: 60
        drop_empty_steps: true
      label: first_error_step
      group_key: task_id
      one_trace_per_task: true
      seed: 20261128
      splits:
        test: 1000
        cal: 1000
        val: 1000
        train_cls: 5000
        train_size: 5000
  - id: processbench_first_error_10plus_v1
    sha256: ad264624e53f7d998a23c789ab35ae45000b94867f09dd8d1b46345f3a8f0294
    content:
      name: processbench, failed traces with 10+ steps, first-error label
      path: data/lrm_traces/normalized/processbench/data.jsonl
      filter:
        has_error: true
        min_steps: 10
        max_steps: null
        drop_empty_steps: true
      label: first_error_step
      group_key: task_id
      one_trace_per_task: true
      seed: 20261128
      splits:
        external: all
  model:
    id: qwen3_5_9b_frozen_v1
    sha256: 2224b3d047b090b07fa57266413f44ee15a9f687c64dd8116299ba8411d4e0e7
    content:
      hub_id: Qwen/Qwen3.5-9B
      path: /home/thanhdo/hub/Qwen/Qwen3.5-9B
      text_submodule: language_model
      dtype: bf16
      layer_fractions:
      - 0.25
      - 0.5
      - 0.75
      - 1.0
      pooling: mean
      max_tokens: 16384
      prompt_format: 'Problem:

        {prompt}


        '
      step_format: 'Step {k}:

        {step}


        '
  metric:
    id: split_cp_cov_ineff_v1
    sha256: 9abb25a60b50e4b788b8d67410d0d96799dcad62b0ebb161cafdd631e1c4a7ac
    content:
      score: hps
      alphas:
      - 0.05
      - 0.1
      - 0.2
      selection:
        split: val
        metric: size_rel
        alpha: 0.1
        protocol: two fixed halves of val; calibrate on one, score the other, both
          ways, averaged
      test:
        calibrate_on: cal
        evaluate_on: test
        coverage_check: Beta(k, m + 1 - k) 95% interval, k = ceil((1 - alpha)(m +
          1))
      external:
        split: external
        recalibrated: 200 random 50/50 calibration/test splits
        zero_shot: threshold from cal applied to all of external
      guardrails:
      - empty_rate
      - full_rate
      - top1
      - coverage_by_len_tercile
      - coverage_by_pos_tercile
params:
  emb_dir: assets/experiments/cp_step_embeddings/emb
  fixed:
    mode: ce
    cls_splits:
    - train_cls
    - train_size
    size_splits: []
    batch_size: 32
    epochs: 50
    weight_decay: 0.01
    alpha: 0.1
  grid:
    layer:
    - 8
    - 16
    - 24
    - 32
    lr:
    - 0.0001
    - 0.0003
    - 0.001
  seeds:
  - 0
  - 1
  - 2
  eval_splits:
  - val
  - cal
  - test
  - external
  posthoc:
    temperatures:
    - 0.25
    - 0.35
    - 0.5
    - 0.7
    - 1.0
    - 1.4
    - 2.0
    - 3.0
    - 4.0
    raps_lambda:
    - 0.001
    - 0.01
    - 0.1
    raps_k_reg:
    - 1
    - 2
    - 5
    position_bins: 10
